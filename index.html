<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task">
            <input type="date" id="dueDateInput">
            <select id="priorityInput">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
            <button id="addTaskBtn">Add Task</button>
        </div>
        <div class="filter-buttons">
            <button id="filterAll" class="filter-btn active">All</button>
            <button id="filterActive" class="filter-btn">Active</button>
            <button id="filterCompleted" class="filter-btn">Completed</button>
        </div>
        <div class="sort-buttons">
            <button id="sortByDueDateBtn" class="sort-btn">Sort by Due Date</button>
            <button id="sortByPriorityBtn" class="sort-btn">Sort by Priority</button>
            <button id="clearSortBtn" class="sort-btn">Default Order</button>
        </div>
        <ul id="taskList">
            <!-- Tasks will be added here -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
